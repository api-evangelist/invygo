aid: invygo
name: Invygo
description: >-
  Invygo is a car subscription and flexible rental platform founded in 2018 in
  Dubai, offering an alternative to traditional car ownership across the UAE,
  Saudi Arabia, and Qatar. Through its iOS and Android apps, customers subscribe
  to a car on a weekly or monthly basis, or enroll in a 36-month, Sharia-compliant
  "Subscribe to Own" plan, with insurance, maintenance, registration, and roadside
  assistance bundled into an all-inclusive fee and no deposit, salary certificate,
  or bank loan required. Invygo reports 20,000+ active subscriptions across 15+
  cities in the GCC. There is no public developer API, OpenAPI, or developer
  portal at this time; this profile captures the company identity and its public
  web, legal, and security surface.
